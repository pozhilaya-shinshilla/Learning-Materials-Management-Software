<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="Учебные материалы" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Учебные материалы</title>
    <script>
      // Тема применяется до первой отрисовки, чтобы не было вспышки светлого экрана.
      try {
        var saved = localStorage.getItem('lms-theme')
        var dark = saved === 'dark' || ((saved === null || saved === 'system') && window.matchMedia('(prefers-color-scheme: dark)').matches)
        if (dark) document.documentElement.classList.add('dark')
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>Для работы приложения нужен JavaScript.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
