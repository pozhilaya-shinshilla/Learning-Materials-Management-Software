# Веб-интерфейс на :80 внутри контейнера; наружу публикуется как http://localhost:8000.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Загрузка материалов: до 100 МБ (MAX_FILE_SIZE_BYTES) плюс поля формы.
    client_max_body_size 101m;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/json;

    # REST API и его документация — в контейнер приложения.
    location ~ ^/(api|docs|redoc|openapi\.json)(/|$) {
        proxy_pass http://app:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;
        proxy_read_timeout 120s;
    }

    # Файлы сборки с хешем в имени кешируются надолго.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Маршруты SPA (/materials/5, /admin/users ...) отдают index.html.
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }
}
